<!doctype html>
<html lang="zh-CN" data-profile="expressive">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0d" />
    <meta name="description" content="ZHUOLIN 的个人主页与项目索引。" />
    <title>ZHUOLIN</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage" id="stage">
      <div class="stage__grain" aria-hidden="true"></div>
      <div class="stage__flare" aria-hidden="true"></div>

      <header class="masthead">
        <a class="avatar" href="#top" aria-label="返回页面开头"><img src="assets/zhuolin-avatar.jpg" alt="ZHUOLIN" /></a>
        <nav class="masthead__nav" aria-label="主要页面">
          <a href="projects/" data-i18n="navProjects">项目</a>
          <a href="contact/" data-i18n="navContact">联系</a>
        </nav>
        <button class="language-switch" type="button" aria-pressed="false">
          <span aria-hidden="true">中</span>
          <span class="sr-only" data-i18n="languageAction">切换到英文</span>
        </button>
      </header>

      <section class="hero" id="top" aria-labelledby="hero-title">
        <h1 class="hero__name" id="hero-title" aria-label="ZHUOLIN">
          <span aria-hidden="true">Z</span><span aria-hidden="true">H</span><span aria-hidden="true">U</span><span aria-hidden="true">O</span><span aria-hidden="true">L</span><span aria-hidden="true">I</span><span aria-hidden="true">N</span>
        </h1>
        <p class="hero__statement" data-i18n="statement">个人项目、工具与正在推进的实验。</p>
        <div class="hero__actions">
          <a class="hero__link" href="projects/" data-i18n="viewProjects">查看项目</a>
          <a class="hero__link hero__link--quiet" href="contact/" data-i18n="getInTouch">联系</a>
        </div>
      </section>

      <footer class="stage__footer">
        <a class="stage__scroll" href="#overview" data-i18n="scrollToProjects">向下查看项目</a>
        <p aria-hidden="true">2026</p>
      </footer>
    </main>

    <section class="home-flow" id="overview" aria-labelledby="overview-title">
      <div class="home-flow__flare" aria-hidden="true"></div>
      <div class="home-flow__intro reveal">
        <p class="home-flow__eyebrow" data-i18n="flowEyebrow">项目目录</p>
        <h2 id="overview-title" data-i18n="flowTitle">向下看，是我正在做的项目。</h2>
        <p data-i18n="flowLead">学习工具、对话归档工具和浏览器内的媒体工具，各自独立，也都还在继续完善。</p>
      </div>

      <div class="home-flow__items" aria-label="项目预览">
        <a class="home-flow__item reveal" href="/lnk-lumen/">
          <span class="home-flow__index">01</span>
          <span>
            <strong>Lnk Lumen</strong>
            <small data-i18n="flowLnk">古诗文学习与复习排程</small>
          </span>
          <span aria-hidden="true">↗</span>
        </a>
        <a class="home-flow__item reveal" href="https://github.com/ZHUOLIN0928/Smart-Export" target="_blank" rel="noreferrer">
          <span class="home-flow__index">02</span>
          <span>
            <strong>Smart Export</strong>
            <small data-i18n="flowSmart">将 AI 对话导出为本地文件</small>
          </span>
          <span aria-hidden="true">↗</span>
        </a>
        <a class="home-flow__item reveal" href="https://github.com/ZHUOLIN0928/ViliDili" target="_blank" rel="noreferrer">
          <span class="home-flow__index">03</span>
          <span>
            <strong>ViliDili</strong>
            <small data-i18n="flowVili">浏览器内的媒体下载工具</small>
          </span>
          <span aria-hidden="true">↗</span>
        </a>
      </div>

      <div class="home-flow__actions reveal">
        <a href="projects/" data-i18n="viewAllProjects">查看全部项目</a>
        <a href="contact/" data-i18n="getInTouch">联系</a>
      </div>
    </section>

    <p class="sr-only" id="stage-status" aria-live="polite"></p>
    <script src="script.js"></script>
  </body>
</html>
